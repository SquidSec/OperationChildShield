version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Patch bumps land as one PR so auto-merge (see dependabot-auto-merge.yml)
    # has a single, reviewable diff instead of many one-line PRs.
    groups:
      pip-patch:
        applies-to: version-updates
        update-types: ["patch"]
      pip-minor:
        applies-to: version-updates
        update-types: ["minor"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # TypeScript 6+/7 breaks Next.js 16 peer/tooling range (<6.1).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-patch:
        applies-to: version-updates
        update-types: ["patch"]
      npm-minor:
        applies-to: version-updates
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-patch:
        applies-to: version-updates
        update-types: ["patch"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    # Avoid major Python jumps that break pip wheels (e.g. 3.12 → 3.14).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    # Avoid major Node jumps (e.g. 20/22 LTS → 26) until Next.js images are ready.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
