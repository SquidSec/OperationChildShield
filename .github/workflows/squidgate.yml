name: SquidGate Pro

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  squidgate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: SquidGate Pro
    runs-on: [self-hosted, Linux, X64, squidsec]
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: SquidGate Pro
        if: env.LLM_API_KEY != ''
        uses: SquidSec/SquidGate@ee0b9fe758c86cec61eca64730926b7aa716f0e8 # v1
        with:
          llm-api-key: ${{ env.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: custom
          llm-model: grok-build-0.1
          llm-base-url: https://api.x.ai/v1

      - name: SquidGate Pro not configured
        if: env.LLM_API_KEY == ''
        run: |
          echo "::error title=SquidGate Pro::Add repository secret LLM_API_KEY to enable the PR security gate."
          exit 1
