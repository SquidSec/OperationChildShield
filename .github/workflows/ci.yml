name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Backend (pytest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Bandit (security)
        run: bandit -q -r backend/app -x backend/tests -ll

      - name: Run pytest
        working-directory: backend
        run: python -m pytest -q --tb=short

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Frontend (vitest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Cache frontend npm
        uses: actions/cache@v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Vitest
        working-directory: frontend
        run: npm test

  security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Container (Trivy config)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@v7

      - name: Trivy filesystem scan (config + secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
