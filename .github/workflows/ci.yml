name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Backend (pytest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          # No pip cache: the post-job upload took ~10 minutes on this pool,
          # longer than installing (~25s) from a warm local index. The runners
          # are persistent, so pip's on-disk cache already helps between runs.
          cache: ""

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Bandit (security)
        run: bandit -q -r backend/app -x backend/tests -ll

      - name: Run pytest (with coverage)
        working-directory: backend
        # --cov=app resolves the source via backend/app; the coverage config
        # (omit main.py, branch mode) lives in the repo-root pyproject.toml, which
        # coverage only discovers via an explicit --cov-config from this cwd.
        # -n auto parallelises across cores: 36s -> 13s locally, and this is the
        # single longest step on a loaded runner.
        run: |
          python -m pytest -q --tb=short -n auto \
            --cov=app --cov-config=../pyproject.toml \
            --cov-report=term-missing --cov-fail-under=70

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Frontend (vitest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # Do NOT cache frontend/node_modules here. It is ~530 MB, and on this
      # self-hosted pool the archive round-trip cost 4 minutes to restore and 4
      # minutes to save - 8 of the job's 10 minutes - to avoid a ~60 second
      # install. npm's own HTTP cache (below) is small and already local.
      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      # One run produces the tests and the coverage gate; the previous split ran
      # Vitest twice for no benefit.
      - name: Vitest (with coverage thresholds)
        working-directory: frontend
        run: npm run test:coverage

  security-scan:
    # This job used aquasecurity/trivy-action, which downloads a ~50 MB binary
    # plus a vulnerability DB from github.com on every run. On this self-hosted
    # pool that download stalls for the full timeout and fails before scanning -
    # observed on 3 of 5 runs - so the gate was both slow and unreliable.
    #
    # It now uses the Trivy CLI that the runner image already provides (the same
    # binary the action would fetch) and scans the repo config. A missing binary
    # is reported loudly instead of being silently skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Container (Trivy config)
    runs-on: [self-hosted, Linux, X64, squidsec]
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      TRIVY_TIMEOUT: 5m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Ensure Trivy is available
        id: find
        run: |
          set -euo pipefail
          if command -v trivy >/dev/null 2>&1; then
            echo "path=$(command -v trivy)" >> "$GITHUB_OUTPUT"
            trivy --version
            exit 0
          fi
          # Install once per runner host. Runners are persistent, so this is a
          # one-time cost; afterwards the warm binary and DB make the scan ~7s.
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          if [ -x "$BIN_DIR/trivy" ]; then
            echo "path=$BIN_DIR/trivy" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Installing trivy into $BIN_DIR (first run on this runner)"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$BIN_DIR"
          echo "path=$BIN_DIR/trivy" >> "$GITHUB_OUTPUT"
          "$BIN_DIR/trivy" --version

      - name: Trivy config + secret scan
        run: |
          set -euo pipefail
          # Scan only what a fresh clone would contain. Self-hosted runners keep
          # local artifacts (.env, .deploy/, data/) that are gitignored and never
          # committed; scanning them flags secrets that cannot leak via the repo.
          CACHE="$HOME/.cache/trivy-ci"
          mkdir -p "$CACHE"
          "${{ steps.find.outputs.path }}" fs . \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --skip-dirs node_modules --skip-dirs .next --skip-dirs .git \
            --skip-dirs .deploy --skip-dirs data \
            --cache-dir "$CACHE"

  e2e:
    # Manual only: needs a running stack and is not part of the required path.
    if: github.event_name == 'workflow_dispatch'
    name: E2E (Playwright smoke, manual)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Installed per-job so Playwright never becomes a repo dependency.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > /tmp/ocs-e2e-frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/admin/login; then exit 0; fi
            sleep 2
          done
          echo "frontend did not become ready"; tail -50 /tmp/ocs-e2e-frontend.log; exit 1

      - name: Run smoke spec
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:3000' }}
        run: npx playwright test e2e/smoke.spec.ts --reporter=list
