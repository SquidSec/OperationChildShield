name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Backend (pytest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: pip-audit
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Bandit (security)
        run: bandit -q -r backend/app -x backend/tests -ll

      - name: Run pytest (with coverage)
        working-directory: backend
        # --cov=app resolves the source via backend/app; the coverage config
        # (omit main.py, branch mode) lives in the repo-root pyproject.toml, which
        # coverage only discovers via an explicit --cov-config from this cwd.
        run: |
          python -m pytest -q --tb=short \
            --cov=app --cov-config=../pyproject.toml \
            --cov-report=term-missing --cov-fail-under=70

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Frontend (vitest)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Cache frontend npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('frontend/package-lock.json', 'frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-node24-

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Run Vitest (coverage)
        working-directory: frontend
        run: npm run test:coverage

  security-scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Container (Trivy config)
    runs-on: [self-hosted, Linux, X64, squidsec]
    env:
      TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
      TRIVY_TIMEOUT: 15m
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trivy filesystem scan (config + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  e2e:
    # Manual only: needs a running stack and is not part of the required path.
    if: github.event_name == 'workflow_dispatch'
    name: E2E (Playwright smoke, manual)
    runs-on: [self-hosted, Linux, X64, squidsec]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Installed per-job so Playwright never becomes a repo dependency.
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm start > /tmp/ocs-e2e-frontend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://localhost:3000/admin/login; then exit 0; fi
            sleep 2
          done
          echo "frontend did not become ready"; tail -50 /tmp/ocs-e2e-frontend.log; exit 1

      - name: Run smoke spec
        working-directory: frontend
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:3000' }}
        run: npx playwright test e2e/smoke.spec.ts --reporter=list
