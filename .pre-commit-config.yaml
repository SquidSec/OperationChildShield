# Fast hygiene checks run on every commit; type-check/lint/tests run pre-push.
# Install with `make precommit-install`. See docs/development.md.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict

  - repo: local
    hooks:
      # --- pre-push: slower, needs node_modules / python deps present ---
      - id: frontend-tsc
        name: frontend typecheck (tsc --noEmit)
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

      - id: frontend-eslint
        name: frontend lint (eslint)
        entry: bash -c 'cd frontend && npx eslint .'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

      - id: backend-pytest
        name: backend tests (pytest -q)
        entry: bash -c 'cd backend && python3 -m pytest -q'
        language: system
        pass_filenames: false
        files: ^backend/
        stages: [pre-push]
